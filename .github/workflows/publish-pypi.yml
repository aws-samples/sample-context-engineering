# Build, test and publish the LangGraph bindings and their shared core to PyPI.
#
# Trigger: push a tag named <package>-v<version>, e.g. `agent-context-core-v0.1.0` or
# `langgraph-relevance-filter-v0.1.0`. Only the tagged package is built and published.
# Manual runs (workflow_dispatch) publish to TestPyPI instead.
#
# Auth: PyPI Trusted Publishing (OIDC) - no API token is stored in the repository.
# One-time setup per package on pypi.org / test.pypi.org -> "Add a new pending publisher":
#   owner/repo = this repository, workflow = publish-pypi.yml, environment = pypi (or testpypi).
#
# Release order: agent-context-core first, the three langgraph-* packages after it.

name: publish-pypi

on:
  push:
    tags:
      - "agent-context-core-v*"
      - "langgraph-relevance-filter-v*"
      - "langgraph-progressive-tool-disclosure-v*"
      - "langgraph-context-graph-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish to TestPyPI
        required: true
        type: choice
        options:
          - agent-context-core
          - langgraph-relevance-filter
          - langgraph-progressive-tool-disclosure
          - langgraph-context-graph

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.resolve.outputs.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve package directory and check the tag matches pyproject
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            pkg="${INPUT_PACKAGE}"
          else
            pkg="${REF_NAME%-v*}"
            tag_version="${REF_NAME##*-v}"
          fi
          case "$pkg" in
            agent-context-core) dir="context-core" ;;
            langgraph-*) dir="langgraph-plugins/$pkg" ;;
            *) echo "unknown package: $pkg"; exit 1 ;;
          esac
          version=$(python -c "import tomllib; print(tomllib.load(open('$dir/pyproject.toml','rb'))['project']['version'])")
          if [ -n "${tag_version:-}" ] && [ "$tag_version" != "$version" ]; then
            echo "tag version $tag_version != pyproject version $version"; exit 1
          fi
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build "${{ steps.resolve.outputs.dir }}" --outdir dist
          python -m twine check --strict dist/*

      - name: Test the built wheel
        # The bindings are tested against the core from this checkout, so a core change and a
        # binding change can be released from the same commit.
        run: |
          python -m venv /tmp/venv
          whl="$(ls dist/*.whl)"
          if [ "${{ steps.resolve.outputs.package }}" = "agent-context-core" ]; then
            /tmp/venv/bin/pip install "${whl}[test]"
          else
            /tmp/venv/bin/pip install ./context-core "${whl}[test]"
          fi
          cd "${{ steps.resolve.outputs.dir }}" && /tmp/venv/bin/python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
