[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "langgraph-relevance-filter"
version = "0.1.0"
description = "LangGraph binding (Practice A): relevance-filter oversized tool results via a create_agent middleware over agent-context-core."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cristiano Scandura" }]
keywords = ["langgraph", "langchain", "middleware", "llm", "agents", "context-engineering", "tool-results"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "agent-context-core>=0.1.0,<0.2",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/aws-samples/sample-context-engineering"
Source = "https://github.com/aws-samples/sample-context-engineering/tree/main/langgraph-plugins/langgraph-relevance-filter"
Issues = "https://github.com/aws-samples/sample-context-engineering/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_relevance_filter"]

[tool.hatch.build.targets.sdist]
include = ["src/langgraph_relevance_filter", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
