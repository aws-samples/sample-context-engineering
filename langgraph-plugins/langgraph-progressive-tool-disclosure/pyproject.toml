[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-progressive-tool-disclosure"
version = "0.1.0"
description = "LangGraph binding (Practice B): progressive tool disclosure via a create_agent middleware over context-core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "context-core",
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_progressive_tool_disclosure"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
